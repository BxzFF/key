<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZeroHxck</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #020610 0%, #051a30 50%, #020610 100%);
            color: #e6f2ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }

        .fondo-grilla {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 140, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 140, 255, 0.06) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.5;
            animation: desplazar 25s linear infinite;
        }

        @keyframes desplazar {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .particula {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00ccff;
            border-radius: 50%;
            box-shadow: 0 0 12px #00ccff;
            animation: flotar 10s infinite ease-in-out;
        }

        @keyframes flotar {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0; }
            25% { opacity: 1; }
            75% { opacity: 1; }
            100% { transform: translateY(-100vh) scale(0.2); opacity: 0; }
        }

        .contenedor {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 25px;
            background: linear-gradient(135deg, #00ccff, #0066ff, #00ccff);
            background-size: 200% 200%;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 46px;
            font-weight: 900;
            color: white;
            animation: brillo 3s ease infinite;
            box-shadow: 0 0 35px rgba(0, 150, 255, 0.45), inset 0 0 20px rgba(255,255,255,0.1);
        }

        @keyframes brillo {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .titulo-principal {
            text-align: center;
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .resaltado {
            color: #00ccff;
            text-shadow: 0 0 20px rgba(0, 200, 255, 0.6);
        }

        .tarjeta {
            background: rgba(8, 16, 35, 0.85);
            border-radius: 26px;
            padding: 40px 30px;
            border: 1px solid rgba(0, 150, 255, 0.25);
            box-shadow: 0 0 50px rgba(0, 120, 255, 0.15), inset 0 1px 0 rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            transform: translateY(20px);
            opacity: 0;
            animation: entrada 0.8s ease forwards;
        }

        @keyframes entrada {
            to { transform: translateY(0); opacity: 1; }
        }

        .etiqueta {
            text-align: center;
            font-size: 14px;
            color: #7ab8e6;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .caja-clave {
            background: rgba(0, 80, 150, 0.2);
            border: 1px solid rgba(0, 180, 255, 0.35);
            border-radius: 16px;
            padding: 25px 20px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 0 25px rgba(0, 200, 255, 0.15);
        }

        .clave-texto {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #00eeff;
            font-family: monospace;
        }

        .boton-copiar {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            background: linear-gradient(90deg, #0066ff, #00ccff, #0066ff);
            background-size: 200% auto;
            transition: all 0.4s ease;
            box-shadow: 0 0 25px rgba(0, 150, 255, 0.35);
        }

        .boton-copiar:hover {
            background-position: 100% center;
            transform: translateY(-2px);
        }

        .boton-copiar.copiado {
            background: linear-gradient(90deg, #00aa55, #00dd77);
            box-shadow: 0 0 25px rgba(0, 200, 100, 0.35);
        }

        .mensaje {
            text-align: center;
            font-size: 14px;
            color: #00ff99;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="fondo-grilla"></div>

    <script>
        for (let i = 0; i < 18; i++) {
            let p = document.createElement('div');
            p.className = 'particula';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 10 + 's';
            document.body.appendChild(p);
        }
    </script>

    <div class="contenedor">
        <div class="logo">Z</div>

        <h1 class="titulo-principal">Zero<span class="resaltado">Hxck</span></h1>

        <div class="tarjeta">
            <p class="etiqueta">Clave de Acceso</p>

            <div class="caja-clave">
                <p class="clave-texto">ZERO-WXS3-JDU3-QWHH</p>
            </div>

            <button class="boton-copiar" id="btnCopiar">COPIAR CLAVE</button>

            <p class="mensaje" id="mensajeCopiado">✓ CLAVE COPIADA</p>
        </div>
    </div>

<script>
    const CLAVE = "ZERO-WXS3-JDU3-QWHH";
    const btnCopiar = document.getElementById('btnCopiar');
    const mensajeCopiado = document.getElementById('mensajeCopiado');

    btnCopiar.addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(CLAVE);
        } catch {
            const temp = document.createElement('input');
            temp.value = CLAVE;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
        }

        btnCopiar.classList.add('copiado');
        btnCopiar.textContent = "CLAVE COPIADA";
        mensajeCopiado.style.display = 'block';

        setTimeout(() => {
            btnCopiar.classList.remove('copiado');
            btnCopiar.textContent = "COPIAR CLAVE";
            mensajeCopiado.style.display = 'none';
        }, 3000);
    });
</script>

</body>
</html>
